vrrp_script check_haproxy {
    script "killall -0 haproxy"
    interval 2
    weight 2
}

vrrp_instance VI_1 {
    state BACKUP
    interface eth0
    virtual_router_id 51
    priority 100                  # Lower than the master node
    advert_int 1
    
    authentication {
        auth_type PASS
        auth_pass a8Fk39sLp0
    }
    
    virtual_ipaddress {
        192.0.2.100/24             # Must match the VIP on the master node
    }
    
    track_script {
        check_haproxy
    }
}