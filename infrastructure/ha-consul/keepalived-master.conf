vrrp_script check_haproxy {
    script "killall -0 haproxy"
    interval 2
    weight 2
}

vrrp_instance VI_1 {
    state MASTER
    interface eth0                # Adjust to your Linode network interface
    virtual_router_id 51
    priority 101                  # Higher than the backup node
    advert_int 1
    
    authentication {
        auth_type PASS
        auth_pass a8Fk39sLp0       # Cluster secret password
    }
    
    virtual_ipaddress {
        192.0.2.100/24             # Replace with your Public/Private Virtual IP (VIP)
    }
    
    track_script {
        check_haproxy
    }
}