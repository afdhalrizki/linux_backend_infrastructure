#!/usr/sbin/nft -f

# Flush existing rules to start fresh
flush ruleset

table inet filter {
    # Set to store malicious IPs dynamically using ipset framework
    set blacklisted_ips {
        type ipv4_addr
        flags interval
        auto-merge
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Allow established and related connections
        ct state established,related accept

        # 2. Allow loopback interface
        iif "lo" accept

        # 3. Drop packets coming from blacklisted IPs instantly
        ip saddr @blacklisted_ips drop

        # 4. Allow ICMP / Ping (limited rate to prevent flood)
        ip protocol icmp limit rate 10/second accept

        # 5. SSH with restriction to Admin IP (Replace <YOUR_IP> with your actual IP, e.g., 203.0.113.50)
        ip saddr <YOUR_IP> tcp dport 22 limit rate 10/second burst 20 packets accept comment "Allow SSH only from admin IP"

        # 6. HTTP/HTTPS with new connection rate limit per IP
        tcp dport { 80, 443 } limit rate over 50/minute burst 100 packets drop comment "Rate limit HTTP/HTTPS new connections"
        tcp dport { 80, 443 } accept comment "Allow HTTP and HTTPS"

        # 7. Allow essential mail server ports
        tcp dport 25 accept comment "Allow SMTP Mail Transfer"
        tcp dport 465 accept comment "Allow SMTPS"
        tcp dport 587 accept comment "Allow Submission"
        tcp dport 993 accept comment "Allow IMAPS (Dovecot Secure)"

        # 8. Drop everything else by default
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy drop;

        # 1. Allow established and related outgoing connections
        ct state established,related accept

        # 2. Allow loopback
        oif "lo" accept

        # 3. Restrict outbound traffic only to approved essential ports and protocols
        # 53 (DNS), 25/465/587 (Mail), 80/443 (HTTP/HTTPS), 123 (NTP), ICMP (Ping)
        tcp dport { 53, 25, 465, 587, 80, 443, 123 } accept
        udp dport { 53, 123 } accept
        ip protocol icmp accept

        # 4. Drop all other unauthorized outbound traffic
    }
}