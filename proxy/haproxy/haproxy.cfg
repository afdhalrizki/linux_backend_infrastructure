global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 4096
    # chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    retries 3
    timeout connect 5s
    timeout client  50s
    timeout server  50s

# Frontend to receive external traffic (HTTP & HTTPS with SSL Termination)
frontend public_front
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/combined_domain.pem
    
    # Load SPOE engine filter for advanced security and rate-limiting
    filter spoe engine security-engine config /etc/haproxy/spoe-security.conf

    # Redirect standard HTTP traffic to secure HTTPS automatically
    redirect scheme https code 301 if !{ ssl_fc }

    # Routing rules based on path or headers
    acl is_mail path_beg /mail
    acl is_web  hdr(host) -i yourdomain.com

    use_backend backend_nginx_mail if is_mail
    default_backend traefik_backend

# Backend for NGINX mail proxy (Postfix + Dovecot)
backend backend_nginx_mail
    mode http
    server nginx_mail_node 127.0.0.1:8080 check

# Backend to forward web traffic to Traefik (running inside the Docker container)
backend traefik_backend
    mode http
    balance roundrobin
    # Points to the 'traefik' service within docker-compose on internal port 80
    server traefik_service traefik:80 check