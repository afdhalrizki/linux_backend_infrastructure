[security-engine]
spoe-agent security-agent
    messages check-request
    option async
    timeout hello 2s
    timeout idle 2m
    timeout processing 10ms
    use-acls
    server security_daemon 127.0.0.1:12345

spoe-message check-request
    args id=src method=req.method path=req.path
    event on-frontend-http-request